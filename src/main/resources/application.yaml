spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:ocr-mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ocrdb}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:user}
    password: ${MYSQL_PASSWORD}
  # 스키마는 Flyway가 만든다 (db/migration/V*.sql). JPA는 맞는지 확인만 (validate)
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 기존 미니 프로젝트 DB(schema.sql로 이미 테이블이 있음)는 V1로 간주하고 V2부터 적용
    # 빈 DB는 V1부터 전부 적용
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: 3600
  storage:
    dir: ./storage
  internal:
    # FastAPI → Spring 내부 API 인증 (/internal/**). 비어 있으면 기동 실패시키도록 구현할 것
    token: ${INTERNAL_API_TOKEN:}
  admin:
    # ADMIN이 하나도 없을 때만 기동 시 생성 (must_change_password = TRUE)
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  ocr:
    client: mock
    base-url: http://0.0.0.0:${PYTHON_SERVER_PORT}
    timeout-seconds: 600