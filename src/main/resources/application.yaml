spring:
  application:
    name: backend
  datasource:
    # 기본값은 로컬 개발용 (mysql-local). 통합(compose)에서는 환경 변수로 덮어쓴다
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:ocrdb}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:user}
    password: ${MYSQL_PASSWORD:pass}
  # 스키마는 Flyway가 만든다 (db/migration/V*.sql). JPA는 맞는지 확인만 (validate)
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 기존 미니 프로젝트 DB(schema.sql로 이미 테이블이 있음)는 V1로 간주하고 V2부터 적용
    # 빈 DB는 V1부터 전부 적용
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: 900
  auth:
    max-failed-login: 10          # 이 횟수만큼 틀리면 잠금
    mail-token-minutes: 10        # 메일 링크 유효 시간 (인증, 비밀번호 재설정)
    mail-max-per-user-hour: 5     # 한 사람에게 1시간에 보낼 수 있는 메일 수
    mail-max-per-ip-hour: 30      # 같은 IP 1시간 요청 수 (회사는 여러 명이 같은 IP)
    refresh-remember-days: 365    # 로그인 유지 체크: 쓸 때마다 다시 365일 → 사실상 로그아웃 전까지
    refresh-short-minutes: 30     # 체크 안 함: 30분 동안 안 쓰면 끝
    password-history-count: 3     # 최근 비밀번호 3개는 다시 못 씀
    cookie-secure: ${COOKIE_SECURE:false}   # https 운영에서 true
  web:
    # 메일 링크가 가리킬 웹 주소
    base-url: ${WEB_BASE_URL:http://localhost:50001}
  admin:
    # ADMIN이 하나도 없을 때만 기동 시 생성 (must_change_password = TRUE)
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  mail:
    # log: 메일 대신 서버 로그에 링크 출력 (개발) / smtp: 실제 발송 (spring.mail.* 필요)
    mode: ${MAIL_MODE:log}
    from: ${MAIL_FROM:no-reply@example.com}
  storage:
    dir: ./storage
  internal:
    # FastAPI → Spring 내부 API 인증 (/internal/**). 비어 있으면 기동 실패시키도록 구현할 것
    token: ${INTERNAL_API_TOKEN:}
  ocr:
    client: mock
    # 로컬 기본값. 통합은 compose 의 APP_OCR_BASE_URL
    base-url: ${APP_OCR_BASE_URL:http://localhost:60100}
    timeout-seconds: 600
  risk:
    # 위험성평가 빈도×강도 점수 → 등급 (에이전트 초안 저장 때). 임시 기준, 실무자 검증 때 조정
    level:
      high-min-score: 12            # 이 점수 이상이면 HIGH
      medium-min-score: 6           # 이 점수 이상이면 MEDIUM, 미만은 LOW
  work:
    list:
      max-days: 31                  # 작업 목록 한 번에 볼 수 있는 기간(일)
      max-rows: 200                 # 작업 목록 최대 행 수
  dashboard:
    max-days: 31                    # 대시보드 기간 집계 최대 일수
    deadline-check-interval-ms: 300000   # 마감 알림(TBM·안전일지·개선조치·승인 지연) 확인 주기 (5분)
  agent:
    # 에이전트 AI 서버: mock(가짜 응답) | fastapi(실제 main-ai-model)
    client: ${APP_AGENT_CLIENT:mock}
    base-url: ${APP_AGENT_BASE_URL:http://localhost:60100}
    connect-timeout-seconds: 2
    read-timeout-seconds: 120
    network-mode: ${NETWORK_ENV:OPEN}
    stale-after-seconds: 180      # 응답 대기(120초)보다 길게. 이보다 오래 PROCESSING 이면 실패로 정리
    sweep-interval-ms: 60000
    # 에이전트 전용 비동기 실행기. 대기열까지 차면 받지 않고, 남은 실행은 위 정리가 실패로 바꾼다
    executor:
      pool-size: 8                  # 동시에 AI 서버를 부르는 실행 수
      queue-capacity: 20            # 기다릴 수 있는 실행 수
      await-termination-seconds: 125  # 종료 시 진행 중 실행을 기다리는 시간 (read-timeout 보다 조금 길게)
